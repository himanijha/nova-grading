# Local Postgres for development. Production uses a hosted database (see README).
#   docker compose up -d     start
#   docker compose down      stop (data is kept in the named volume)
#   docker compose down -v   stop and delete the data
services:
  db:
    image: postgres:16-alpine
    container_name: nova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova
    ports:
      - "55432:5432"
    volumes:
      - nova-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nova-pgdata:
